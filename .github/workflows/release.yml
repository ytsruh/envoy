name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Derive and verify version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep '^version =' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag version: $TAG / Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VERSION. Bump [workspace.package] version and retag."
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        shell: bash
        env:
          ENVOY_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked -p envoy-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="dist/envoy-v${{ env.VERSION }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/envoy" "$STAGE/"
          tar -czf "$STAGE.tar.gz" -C dist "envoy-v${{ env.VERSION }}-${{ matrix.target }}"
          (cd dist && shasum -a 256 "envoy-v${{ env.VERSION }}-${{ matrix.target }}.tar.gz" > "envoy-v${{ env.VERSION }}-${{ matrix.target }}.tar.gz.sha256")

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Stage = "dist/envoy-v$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/envoy.exe" "$Stage/"
          Compress-Archive -Path "$Stage/*" -DestinationPath "$Stage.zip"
          (Get-FileHash "$Stage.zip" -Algorithm SHA256).Hash.ToLower() + "  $(Split-Path $Stage -Leaf).zip" | Out-File -Encoding ascii "$Stage.zip.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
