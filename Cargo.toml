[workspace]
members = ["crates/shared", "crates/server", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit", "compression-full"] }
