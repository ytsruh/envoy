<!-- Installation Section -->
<div id="install" class="py-24 bg-dark-800 relative">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <h2 class="text-3xl font-bold text-white mb-4">Get Started</h2>
      <p class="text-slate-400 max-w-2xl mx-auto">Build from source with Rust and start managing your env vars.</p>
    </div>
    <div class="max-w-3xl mx-auto">
      <div class="glass-panel rounded-2xl overflow-hidden">
        <div class="bg-dark-900 px-6 py-4 border-b border-slate-700">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
          </div>
        </div>
        <div class="p-8">
          <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-2">Build</label>
            <div class="bg-dark-900 rounded-lg p-4 font-mono text-sm md:text-base text-slate-300 flex items-center justify-between gap-4">
              <span>make build-release</span>
              <button class="text-slate-400 hover:text-white transition-colors" onclick="navigator.clipboard.writeText('make build-release')">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-2">Run the server</label>
            <div class="bg-dark-900 rounded-lg p-4 font-mono text-sm md:text-base text-slate-300 flex items-center justify-between gap-4">
              <span>./target/release/envoy-server</span>
              <button class="text-slate-400 hover:text-white transition-colors" onclick="navigator.clipboard.writeText('./target/release/envoy-server')">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-2">Connect the CLI</label>
            <div class="bg-dark-900 rounded-lg p-4 font-mono text-sm md:text-base text-slate-300">envoy setup connect --url http://localhost:8080<br />envoy setup init<br />envoy setup login</div>
          </div>
          <div class="glass-panel border-l-4 border-blue-500 p-4 rounded-r-xl">
            <div class="flex items-start gap-3">
              <svg class="w-5 h-5 text-blue-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <p class="text-sm text-slate-300">Requires Rust stable. Binaries land in <span class="font-mono">target/release/</span>: <span class="font-mono">envoy</span>, <span class="font-mono">envoy-server</span>.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
